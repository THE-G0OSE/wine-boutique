# Проверки на каждый push; из main фронт выкладывается на GitHub Pages.
# Бэкенд (services/*, service-kit) в CI пока не участвует — проверяется локально (pnpm test), разворачивается на VPS.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Линтер, типы, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Только фронт и пакеты, от которых он зависит (contracts, demo-data)
      - run: pnpm install --frozen-lockfile --filter wine-boutique --filter "@wine/web..."

      # Сгенерированное из контракта закоммичено и актуально
      - name: Контракты сгенерированы из openapi.yaml
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/contracts

      - run: pnpm turbo run lint typecheck --filter "@wine/web..."

      # Сборка сразу под GitHub Pages. Без переменных репозитория — подпапка /<имя репозитория>/ и моки MSW.
      # С бэкендом на VPS (Settings → Secrets and variables → Actions → Variables):
      #   API_URL=https://api.<домен>/api — фронт ходит в настоящий API (его origin попадёт в CSP);
      #   PAGES_BASE_PATH=/ — если у Pages свой домен (без него cookie сессии не будут «своими»);
      #   SITE_URL=https://<домен>/ — адрес сайта для превью ссылок (Open Graph), по умолчанию — адрес Pages
      - name: Сборка
        run: pnpm turbo run build --filter "@wine/web..."
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VITE_API_URL: ${{ vars.API_URL || '/api' }}
          VITE_API_MOCKS: ${{ vars.API_URL && 'false' || 'true' }}

      # У Pages нет SPA-фолбэка: прямой заход на /news/archive отдаёт 404.html — пусть это будет само приложение
      - name: SPA-фолбэк для Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Артефакт для Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Деплой на GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Выкладки не отменяют друг друга на середине
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
