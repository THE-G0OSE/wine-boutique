# Проверки качества на каждый push. Деплоя здесь нет: хостинг собирает Docker-образ
# из репозитория сам (см. README → «Деплой»).
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Линтер, типы, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Сгенерированное из контракта закоммичено и актуально
      - name: Контракты сгенерированы из openapi.yaml
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/contracts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Docker-образ собирается
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: wine-boutique:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Контейнер поднимается и отдаёт приложение по любому пути (SPA-фолбэк)
      - name: Смоук-тест контейнера
        run: |
          docker run -d --name app -p 8080:8080 wine-boutique:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/shop/red | grep -q '<div id="root">'
          curl -fsI http://localhost:8080/mockServiceWorker.js | grep -qi 'cache-control: no-cache'
          docker logs app
