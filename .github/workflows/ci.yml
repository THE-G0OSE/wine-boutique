# Проверки на каждый push; из main фронт выкладывается на GitHub Pages.
# Бэкенд в CI пока не участвует — он будет разворачиваться на VPS.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Линтер, типы, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Сгенерированное из контракта закоммичено и актуально
      - name: Контракты сгенерированы из openapi.yaml
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/contracts

      - run: pnpm lint
      - run: pnpm typecheck

      # Сборка сразу под GitHub Pages: сайт живёт в подпапке /<имя репозитория>/, API — моки MSW
      - name: Сборка
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # У Pages нет SPA-фолбэка: прямой заход на /news/archive отдаёт 404.html — пусть это будет само приложение
      - name: SPA-фолбэк для Pages
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Артефакт для Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Деплой на GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Выкладки не отменяют друг друга на середине
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
