# Статика фронта за Traefik (TLS, сжатие и лимиты — там же не нужны: gzip — здесь)
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Файлы с хешем в имени не меняются — кешируются навсегда
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Картинки без хеша: неделя
  location /images/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA: неизвестный путь — приложение (его роутер покажет 404); index.html всегда перепроверяется
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
