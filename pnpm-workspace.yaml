packages:
  - apps/*
  - packages/*
  - services/*

# Точные версии при pnpm add: обновления — осознанно (Renovate), а не по ^
saveExact: true

# Типы — в корневой node_modules: иначе d.ts зависимостей внутри .pnpm (react-icons, react-router)
# не находят @types/react, который стоит только в apps/web
publicHoistPattern:
  - '@types/*'

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - prisma
  - unrs-resolver

# Скрипт установки protobufjs (из OpenTelemetry) только печатает предупреждения — не нужен
ignoredBuiltDependencies:
  - protobufjs
