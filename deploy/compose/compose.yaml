# Бэкенд целиком для разработки: pnpm backend:up → API на http://localhost:18080/api
# Порты хоста — вне диапазонов, которые Windows резервирует под Hyper-V (8080/8081/8222 там часто заняты);
# переопределяются переменными GATEWAY_PORT, TRAEFIK_DASHBOARD_PORT, NATS_MONITOR_PORT
# Наблюдаемость (Grafana на http://localhost:3001): pnpm backend:up:observability
name: wine-boutique

x-service: &service
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: none
    # Сайты, с которых браузер может слать формы (проверка Origin): Vite dev-сервер
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
  depends_on:
    postgres: { condition: service_healthy }
    nats: { condition: service_healthy }

services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Для всех маршрутов: вырезать заголовок пользователя, пришедший снаружи
      - --entrypoints.web.http.middlewares=strip-internal-headers@file
      - --ping=true
      - --api.dashboard=true
      - --api.insecure=true # дашборд только локально, на :18081
      - --accesslog=true
      - --accesslog.format=json
      # Трейс начинается на шлюзе; включается вместе с профилем observability
      - --tracing.otlp=${TRAEFIK_TRACING:-false}
      - --tracing.otlp.http.endpoint=http://otel-lgtm:4318/v1/traces
      - --tracing.serviceName=traefik
    ports:
      - "${GATEWAY_PORT:-18080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-18081}:8080"
    volumes:
      - ../traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      # Только в разработке: тестовые маршруты края для pnpm test:e2e
      - ../traefik/dev/edge-check.yml:/etc/traefik/dynamic/edge-check.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 5432 на машине разработки часто занят локальным Postgres — свой порт, чтобы не перепутать базы
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # По TCP: при первом запуске init-скрипты работают на временном сервере, который слушает только сокет, —
      # проверка через сокет сказала бы «готов» раньше, и миграции сервисов не достучались бы до базы
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      retries: 10
      # Первый запуск (init-скрипты, контрольная точка при перезапуске) на медленном диске дольше 50 с
      start_period: 2m
      start_interval: 2s

  # Базы и роли сервисов — при каждом up: досоздаёт недостающие (новый сервис на старом томе), остальные не трогает
  postgres-init:
    image: postgres:18.6-alpine
    restart: "no"
    entrypoint: ["sh", "/scripts/01-service-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVICE_DATABASES: catalog news reviews newsletter identity reservations
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:-dev}
      # Для prisma migrate dev (теневая база); на VPS — false
      ROLE_CREATEDB: "true"
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres: { condition: service_healthy }

  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "${NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 10

  # Миграции identity: пользователей и сессий в сиде нет — сессии для разработки выдаёт CLI
  identity-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: identity }
    image: wine-boutique/identity-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://identity:${DEV_DB_PASSWORD:-dev}@postgres:5432/identity
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }

  # Сессия для разработки: docker compose exec identity node dist/cli.js session:issue --name "Анна Кузнецова"
  identity:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: identity }
    image: wine-boutique/identity:dev
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      OTEL_SERVICE_NAME: identity
      DATABASE_URL: postgresql://identity:${DEV_DB_PASSWORD:-dev}@postgres:5432/identity
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      identity-migrate: { condition: service_completed_successfully }

  # Эхо-сервис для проверки края (маршруты из traefik/dev/edge-check.yml): показывает, какие заголовки дошли до сервиса
  whoami:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped

  # Миграции и демо-данные catalog — до старта сервиса
  catalog-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: catalog }
    image: wine-boutique/catalog-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://catalog:${DEV_DB_PASSWORD:-dev}@postgres:5432/catalog
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }

  catalog:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: catalog }
    image: wine-boutique/catalog:dev
    environment:
      <<: *service-env
      SERVICE_NAME: catalog
      OTEL_SERVICE_NAME: catalog
      DATABASE_URL: postgresql://catalog:${DEV_DB_PASSWORD:-dev}@postgres:5432/catalog
      GRPC_URL: 0.0.0.0:50051
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      catalog-migrate: { condition: service_completed_successfully }

  # Миграции и демо-данные news; вина статей сид берёт у catalog по gRPC — ждём его готовности
  news-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: news }
    image: wine-boutique/news-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://news:${DEV_DB_PASSWORD:-dev}@postgres:5432/news
      CATALOG_GRPC_URL: catalog:50051
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }
      catalog: { condition: service_healthy }

  news:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: news }
    image: wine-boutique/news:dev
    environment:
      <<: *service-env
      SERVICE_NAME: news
      OTEL_SERVICE_NAME: news
      DATABASE_URL: postgresql://news:${DEV_DB_PASSWORD:-dev}@postgres:5432/news
      CATALOG_GRPC_URL: catalog:50051
    # catalog не в зависимостях запуска: без него газета работает, просто без стикера вина
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      news-migrate: { condition: service_completed_successfully }

  # Миграции и опубликованные письма из макетов
  reviews-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: reviews }
    image: wine-boutique/reviews-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://reviews:${DEV_DB_PASSWORD:-dev}@postgres:5432/reviews
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }

  # Модерация писем: docker compose exec reviews node dist/cli.js list
  reviews:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: reviews }
    image: wine-boutique/reviews:dev
    environment:
      <<: *service-env
      SERVICE_NAME: reviews
      OTEL_SERVICE_NAME: reviews
      DATABASE_URL: postgresql://reviews:${DEV_DB_PASSWORD:-dev}@postgres:5432/reviews
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      reviews-migrate: { condition: service_completed_successfully }

  # Только миграции: демо-подписчиков нет
  newsletter-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: newsletter }
    image: wine-boutique/newsletter-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://newsletter:${DEV_DB_PASSWORD:-dev}@postgres:5432/newsletter
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }

  newsletter:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: newsletter }
    image: wine-boutique/newsletter:dev
    environment:
      <<: *service-env
      SERVICE_NAME: newsletter
      OTEL_SERVICE_NAME: newsletter
      DATABASE_URL: postgresql://newsletter:${DEV_DB_PASSWORD:-dev}@postgres:5432/newsletter
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      newsletter-migrate: { condition: service_completed_successfully }

  # Миграции и бутики из макетов
  reservations-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: reservations }
    image: wine-boutique/reservations-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://reservations:${DEV_DB_PASSWORD:-dev}@postgres:5432/reservations
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-init: { condition: service_completed_successfully }

  # Брони: вина и цены проверяет у catalog по gRPC — без него бронь не создаётся (503), бутики и слоты работают
  reservations:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: reservations }
    image: wine-boutique/reservations:dev
    environment:
      <<: *service-env
      SERVICE_NAME: reservations
      OTEL_SERVICE_NAME: reservations
      DATABASE_URL: postgresql://reservations:${DEV_DB_PASSWORD:-dev}@postgres:5432/reservations
      CATALOG_GRPC_URL: catalog:50051
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      reservations-migrate: { condition: service_completed_successfully }

  # Трейсы, метрики и логи в одном контейнере: OTel Collector + Tempo + Prometheus + Loki + Grafana
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - "3001:3000"
      - "4318:4318"

volumes:
  postgres-data:
  nats-data:
