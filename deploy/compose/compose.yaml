# Бэкенд целиком для разработки: pnpm backend:up → API на http://localhost:18080/api
# Порты хоста — вне диапазонов, которые Windows резервирует под Hyper-V (8080/8081/8222 там часто заняты);
# переопределяются переменными GATEWAY_PORT, TRAEFIK_DASHBOARD_PORT, NATS_MONITOR_PORT
# Наблюдаемость (Grafana на http://localhost:3001): pnpm backend:up:observability
name: wine-boutique

x-service: &service
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: none
  depends_on:
    postgres: { condition: service_healthy }
    nats: { condition: service_healthy }

services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --ping=true
      - --api.dashboard=true
      - --api.insecure=true # дашборд только локально, на :18081
      - --accesslog=true
      - --accesslog.format=json
      # Трейс начинается на шлюзе; включается вместе с профилем observability
      - --tracing.otlp=${TRAEFIK_TRACING:-false}
      - --tracing.otlp.http.endpoint=http://otel-lgtm:4318/v1/traces
      - --tracing.serviceName=traefik
    ports:
      - "${GATEWAY_PORT:-18080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-18081}:8080"
    volumes:
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVICE_DATABASES: catalog news reviews newsletter identity
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:-dev}
    ports:
      # 5432 на машине разработки часто занят локальным Postgres — свой порт, чтобы не перепутать базы
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "${NATS_MONITOR_PORT:-18222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 10

  identity:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: identity }
    image: wine-boutique/identity:dev
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      OTEL_SERVICE_NAME: identity

  # Миграции и демо-данные catalog — до старта сервиса
  catalog-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: catalog }
    image: wine-boutique/catalog-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://catalog:${DEV_DB_PASSWORD:-dev}@postgres:5432/catalog
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }

  catalog:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: catalog }
    image: wine-boutique/catalog:dev
    environment:
      <<: *service-env
      SERVICE_NAME: catalog
      OTEL_SERVICE_NAME: catalog
      DATABASE_URL: postgresql://catalog:${DEV_DB_PASSWORD:-dev}@postgres:5432/catalog
      GRPC_URL: 0.0.0.0:50051
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      catalog-migrate: { condition: service_completed_successfully }

  # Миграции и демо-данные news; вина статей сид берёт у catalog по gRPC — ждём его готовности
  news-migrate:
    build:
      context: ../..
      dockerfile: services/Dockerfile
      target: migrate
      args: { SERVICE: news }
    image: wine-boutique/news-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://news:${DEV_DB_PASSWORD:-dev}@postgres:5432/news
      CATALOG_GRPC_URL: catalog:50051
      SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      catalog: { condition: service_healthy }

  news:
    <<: *service
    build:
      context: ../..
      dockerfile: services/Dockerfile
      args: { SERVICE: news }
    image: wine-boutique/news:dev
    environment:
      <<: *service-env
      SERVICE_NAME: news
      OTEL_SERVICE_NAME: news
      DATABASE_URL: postgresql://news:${DEV_DB_PASSWORD:-dev}@postgres:5432/news
      CATALOG_GRPC_URL: catalog:50051
    # catalog не в зависимостях запуска: без него газета работает, просто без стикера вина
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      news-migrate: { condition: service_completed_successfully }

  # Трейсы, метрики и логи в одном контейнере: OTel Collector + Tempo + Prometheus + Loki + Grafana
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - "3001:3000"
      - "4318:4318"

volumes:
  postgres-data:
  nats-data:
