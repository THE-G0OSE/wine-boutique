# Только для VPS (compose.prod.yaml): то, чего нет в разработке, где фронт ходит в API через прокси Vite.
# Шаблон Go: значения — из окружения контейнера Traefik.
http:
  middlewares:
    # Нужен, только если фронт на другом origin (Pages со своим доменом и API на поддомене); фронт с VPS — тот же origin.
    # Методы — все из контракта: кабинет шлёт PATCH, PUT и DELETE
    cors:
      headers:
        accessControlAllowOriginList: ['{{ env "FRONT_ORIGIN" }}']
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders: [Content-Type]
        accessControlAllowCredentials: true
        accessControlMaxAge: 600
        addVaryHeader: true

    # Грубый лимит с одного адреса против потока запросов; точные лимиты форм — в сервисах (@RateLimit).
    # С запасом: за одним адресом мобильного оператора (CGNAT) бывают сотни посетителей.
    # Ответ сверх лимита — 429 от Traefik простым текстом, не в формате контракта
    gateway-rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200

  routers:
    # Фронт (apps/web/Dockerfile) — всё, что не /api: маршруты API из dynamic.yml сюда не попадают
    web:
      rule: "!PathPrefix(`/api`)"
      priority: 1
      entryPoints: [web]
      service: web

  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:80
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s
