# Маршруты шлюза: путь публичного API → сервис-владелец (раскладка — packages/contracts/openapi/ownership.ts).
# Префикс /api не срезается: сервисы сами обслуживают /api/*.
http:
  routers:
    identity:
      rule: PathPrefix(`/api/auth`)
      entryPoints: [web]
      service: identity

    catalog:
      rule: PathPrefix(`/api/wines`) || PathPrefix(`/api/grapes`)
      entryPoints: [web]
      service: catalog

    news:
      rule: PathPrefix(`/api/news`)
      entryPoints: [web]
      service: news

  services:
    news:
      loadBalancer:
        servers:
          - url: http://news:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    catalog:
      loadBalancer:
        servers:
          - url: http://catalog:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    identity:
      loadBalancer:
        servers:
          - url: http://identity:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s
