# Маршруты шлюза: путь публичного API → сервис-владелец (раскладка — packages/contracts/openapi/ownership.ts).
# Префикс /api не срезается: сервисы сами обслуживают /api/*.
http:
  routers:
    identity:
      rule: PathPrefix(`/api/auth`)
      entryPoints: [web]
      service: identity

  services:
    identity:
      loadBalancer:
        servers:
          - url: http://identity:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s
