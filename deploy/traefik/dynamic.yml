# Маршруты шлюза: путь публичного API → сервис-владелец (раскладка — packages/contracts/openapi/ownership.ts).
# Префикс /api не срезается: сервисы сами обслуживают /api/*.
# Правила — по целым сегментам пути (PathRegexp …(/|$)): простой PathPrefix(`/api/news`) поймал бы и /api/newsletter.
# На Windows изменения этого файла Traefik может не заметить — после правки: docker compose restart traefik
http:
  middlewares:
    # На входе для всех маршрутов (entrypoint web): заголовок пользователя ставит только шлюз, присланный снаружи — вырезается
    strip-internal-headers:
      headers:
        customRequestHeaders:
          X-User-Id: ""

    # Для путей, где нужен вошедший пользователь: middlewares: [require-session].
    # identity проверяет cookie сессии: вошёл — X-User-Id уходит в сервис, гость — клиенту 401 в формате контракта
    require-session:
      forwardAuth:
        address: http://identity:3000/internal/forward-auth
        authRequestHeaders: [Cookie]
        authResponseHeaders: [X-User-Id]
        # Продлённая сессия — cookie с новым сроком в ответ клиенту
        addAuthCookiesToResponse: [__Host-session]

    # Для публичных форм (бронь, запись, подписка): вошёл — X-User-Id уходит в сервис и запись попадёт в кабинет,
    # гость — запрос проходит как есть. Только на POST форм: чтения лишний вызов identity не платят
    optional-session:
      forwardAuth:
        address: http://identity:3000/internal/forward-auth-optional
        authRequestHeaders: [Cookie]
        authResponseHeaders: [X-User-Id]
        addAuthCookiesToResponse: [__Host-session]

  routers:
    identity:
      rule: PathRegexp(`^/api/auth(/|$)`)
      entryPoints: [web]
      service: identity

    # Кабинет: всё под /api/me — только для вошедших, раскладка по сервисам-владельцам (ownership.ts)
    identity-me:
      rule: PathRegexp(`^/api/me(/sign-out-everywhere)?$`)
      entryPoints: [web]
      middlewares: [require-session]
      service: identity

    reservations-me:
      rule: PathRegexp(`^/api/me/reservations(/|$)`)
      entryPoints: [web]
      middlewares: [require-session]
      service: reservations

    tastings-me:
      rule: PathRegexp(`^/api/me/tastings(/|$)`)
      entryPoints: [web]
      middlewares: [require-session]
      service: tastings

    cellar-me:
      rule: PathRegexp(`^/api/me/cell(/|$)`)
      entryPoints: [web]
      middlewares: [require-session]
      service: cellar

    requests-me:
      rule: PathRegexp(`^/api/me/(monthly|certificates)(/|$)`)
      entryPoints: [web]
      middlewares: [require-session]
      service: requests

    loyalty-me:
      rule: PathRegexp(`^/api/me/(loyalty|favorites)(/|$)`)
      entryPoints: [web]
      middlewares: [require-session]
      service: loyalty

    # Формы, чьи записи видны в кабинете: необязательная сессия (правило длиннее — выигрывает у общего маршрута сервиса)
    reservations-form:
      rule: Method(`POST`) && PathRegexp(`^/api/reservations$`)
      entryPoints: [web]
      middlewares: [optional-session]
      service: reservations

    tastings-form:
      rule: Method(`POST`) && PathRegexp(`^/api/tastings/[^/]+/(bookings|waitlist)$`)
      entryPoints: [web]
      middlewares: [optional-session]
      service: tastings

    requests-form:
      rule: Method(`POST`) && PathRegexp(`^/api/monthly/subscriptions$`)
      entryPoints: [web]
      middlewares: [optional-session]
      service: requests

    catalog:
      rule: PathRegexp(`^/api/(wines|grapes|shelves|search)(/|$)`)
      entryPoints: [web]
      service: catalog

    news:
      rule: PathRegexp(`^/api/news(/|$)`)
      entryPoints: [web]
      service: news

    reviews:
      rule: PathRegexp(`^/api/reviews(/|$)`)
      entryPoints: [web]
      service: reviews

    newsletter:
      rule: PathRegexp(`^/api/newsletter(/|$)`)
      entryPoints: [web]
      service: newsletter

    reservations:
      rule: PathRegexp(`^/api/(boutiques|reservations)(/|$)`)
      entryPoints: [web]
      service: reservations

    tastings:
      rule: PathRegexp(`^/api/tastings(/|$)`)
      entryPoints: [web]
      service: tastings

    cellar:
      rule: PathRegexp(`^/api/cellar(/|$)`)
      entryPoints: [web]
      service: cellar

    requests:
      rule: PathRegexp(`^/api/(requests|monthly|certificates)(/|$)`)
      entryPoints: [web]
      service: requests

  services:
    reservations:
      loadBalancer:
        servers:
          - url: http://reservations:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    tastings:
      loadBalancer:
        servers:
          - url: http://tastings:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    cellar:
      loadBalancer:
        servers:
          - url: http://cellar:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    requests:
      loadBalancer:
        servers:
          - url: http://requests:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    loyalty:
      loadBalancer:
        servers:
          - url: http://loyalty:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    reviews:
      loadBalancer:
        servers:
          - url: http://reviews:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    newsletter:
      loadBalancer:
        servers:
          - url: http://newsletter:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    news:
      loadBalancer:
        servers:
          - url: http://news:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    catalog:
      loadBalancer:
        servers:
          - url: http://catalog:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    identity:
      loadBalancer:
        servers:
          - url: http://identity:3000
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s
