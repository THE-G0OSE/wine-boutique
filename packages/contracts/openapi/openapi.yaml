      type: object
      required: [subscription]
      properties:
        subscription:
          oneOf:
            - $ref: "#/components/schemas/MonthlySubscription"
            - type: "null"

    MonthlySubscriptionUpdate:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [active, paused]
        skipNext:
          type: boolean
          description: Пропустить следующий месяц (false — вернуть)

    MyCertificate:
      type: object
      required: [serial, nominal, balance, validUntil, from, status]
      properties:
        serial:
          type: string
        nominal:
          type: integer
        balance:
          type: integer
          description: Сколько осталось, ₽
        validUntil:
          type: string
          format: date
        from:
          type: string
        status:
          type: string
          enum: [awaiting_payment, active, redeemed, expired]

    MyCertificates:
      type: array
      items:
        $ref: "#/components/schemas/MyCertificate"

    CertificateClaim:
      type: object
      required: [serial]
      properties:
        serial:
          type: string
          pattern: "^WB-\\d{4}-\\d{6}$"
          examples: [WB-2026-000123]

    LoyaltyLevel:
      type: string
      description: guest — гость, connoisseur — ценитель (от 6 бутылок за год), sommelier — сомелье (от 12), cellar — погреб (от 24)
      enum: [guest, connoisseur, sommelier, cellar]

    BonusEntry:
      type: object
      required: [id, at, title, amount]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        title:
          type: string
        amount:
          type: integer
          description: Плюс — начислено, минус — списано

    Loyalty:
      type: object
      required: [balance, level, bottles, nextLevel, history]
      properties:
        balance:
          type: integer
          description: Бонусов; 1 бонус = 1 ₽ при оплате в бутике, до 30 % чека
        level:
          $ref: "#/components/schemas/LoyaltyLevel"
        bottles:
          type: integer
          description: Бутылок за последние 12 месяцев — по ним уровень
        nextLevel:
          oneOf:
            - type: object
              required: [level, bottles]
              properties:
                level:
                  $ref: "#/components/schemas/LoyaltyLevel"
                bottles:
                  type: integer
                  description: Сколько бутылок нужно для уровня
            - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/BonusEntry"

    MyFavorites:
      type: array
      items:
        $ref: "#/components/schemas/WineSummary"

    WinePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WineSummary"
        total:
          type: integer
          description: Сколько всего вин подходит под фильтр

    GrapeVariety:
      type: object
      required: [id, slug, name, type, origin, taste, harvest, description, plantation, image, wines]
      properties:
        id:
          type: string
        slug:
          type: string
          examples: [cabernet-sauvignon]
        name:
          type: string
          examples: [Каберне Совиньон]
        type:
          type: string
          enum: [red, white]
        origin:
          type: string
          description: Родина сорта
        taste:
          type: string
          description: Вкус и аромат
        harvest:
          type: string
          description: Когда собирают
        description:
          type: string
        plantation:
          type: [string, "null"]
          description: Участок, площадь, высота на собственной плантации
        image:
          type: string
          description: URL изображения грозди на прозрачном фоне
        wines:
          type: array
          description: Вина из этого сорта (до трёх)
          items:
            $ref: "#/components/schemas/WineSummary"

    PhoneCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Российский номер в формате +7XXXXXXXXXX
          pattern: "^\\+7\\d{10}$"
          examples: ["+79161234567"]

    PhoneCodeSent:
      type: object
      required: [resendAfter, expiresIn]
      properties:
        resendAfter:
          type: integer
          description: Через сколько секунд можно попросить новый код
          examples: [60]
        expiresIn:
          type: integer
          description: Сколько секунд действует код
          examples: [300]
        demoCode:
          type: string
          description: |
            Только в демо-режиме (портфолио без SMS-провайдера, `DEMO_CODES=true` у identity): сам код,
            чтобы показать его на экране входа. В обычном режиме поля нет — код приходит по SMS.
          pattern: "^\\d{4}$"
          examples: ["4821"]

    PhoneCodeCheck:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Российский номер в формате +7XXXXXXXXXX
          pattern: "^\\+7\\d{10}$"
          examples: ["+79161234567"]
        code:
          type: string
          pattern: "^\\d{4}$"

    PhoneVerification:
      oneOf:
        - type: object
          required: [status, user]
          properties:
            status:
              type: string
              const: signed_in
            user:
              $ref: "#/components/schemas/SessionUser"
        - type: object
          required: [status, registrationToken]
          properties:
            status:
              type: string
              const: needs_registration
            registrationToken:
              type: string
              description: Подтверждённый номер — передать в /auth/register в течение 15 минут
      discriminator:
        propertyName: status

    GuestRegistration:
      type: object
      required: [registrationToken, name, birthDate, consents]
      properties:
        registrationToken:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 80
        birthDate:
          type: string
          format: date
          description: Кабинет — с 18 лет
        email:
          type: string
          format: email
          maxLength: 120
        consents:
          type: object
          required: [personalData, marketing]
          properties:
            personalData:
              type: boolean
              const: true
              description: Согласие на обработку персональных данных
            marketing:
              type: boolean
              description: Анонсы поставок и дегустаций

    SessionUser:
      type: object
      required: [id, name, initials, cardNumber]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
          examples: [АК]
        cardNumber:
          type: [string, "null"]
          description: Номер карты гостя, 12 цифр; null — карты нет (пользователь без телефона)
          examples: ["004219880716"]

    Session:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: "null"

    NewsRubric:
      type: string
      description: supply — поставки, harvest — урожай, tasting — дегустации, events — события
      enum: [supply, harvest, tasting, events]

    NewsImage:
      type: object
      required: [src, alt, caption]
      properties:
        src:
          type: string
        alt:
          type: string
        caption:
          type: [string, "null"]
          description: Подпись под иллюстрацией

    NewsEvent:
      type: object
      description: Когда и сколько мест — для материалов-анонсов (дегустация, встреча)
      required: [startsAt, seats]
      properties:
        startsAt:
          type: [string, "null"]
          format: date-time
          description: null — дата ещё не назначена
        seats:
          type: [integer, "null"]

    NewsStory:
      type: object
      required: [slug, rubric, kicker, title, standfirst, byline, readingMinutes, image, body, event]
      properties:
        slug:
          type: string
          description: Адрес статьи — /news/{slug}
        rubric:
          $ref: "#/components/schemas/NewsRubric"
        kicker:
          type: string
          description: Надзаголовок, например «Поставки · Главное»
          examples: [Поставки · Главное]
        title:
          type: string
        standfirst:
          type: [string, "null"]
          description: Лид — курсивный абзац под заголовком
        byline:
          type: [string, "null"]
          examples: [Текст: редакция «Вестника»]
        readingMinutes:
          type: [integer, "null"]
        image:
          oneOf:
            - $ref: "#/components/schemas/NewsImage"
            - type: "null"
        body:
          type: array
          description: Абзацы текста на полосе
          items:
            type: string
        event:
          oneOf:
            - $ref: "#/components/schemas/NewsEvent"
            - type: "null"

    NewsBrief:
      type: object
      description: Заметка в колонке «Коротко»
      required: [rubric, title, text]
      properties:
        rubric:
          $ref: "#/components/schemas/NewsRubric"
        title:
          type: string
        text:
          type: string

    NewsAd:
      type: object
      description: Объявление на второй полосе
      required: [kicker, title, text, image, emphasis]
      properties:
        kicker:
          type: [string, "null"]
          examples: [Сдаётся]
        title:
          type: string
        text:
          type: string
        image:
          type: [string, "null"]
          description: Гравюра над объявлением
        emphasis:
          type: boolean
          description: Двойная рамка — объявление выделено

    NewsAfishaItem:
      type: object
      required: [startsAt, title, format, capacityLimited, seats]
      properties:
        startsAt:
          type: [string, "null"]
          format: date-time
        title:
          type: string
        format:
          type: string
          examples: [Дегустация в погребе]
        capacityLimited:
          type: boolean
          description: false — мест без ограничения (например, вебинар), в афише прочерк
        seats:
          type: [integer, "null"]
          description: Сколько мест, если capacityLimited; null — ещё не известно

    NewsIssue:
      type: object
      required:
        [id, number, publishedAt, city, weather, lead, stories, briefs, quote, nextIssueTeaser, ads, afisha, previousIssueId, nextIssueId]
      properties:
        id:
          type: string
        number:
          type: [integer, "null"]
          description: Номер выпуска; null — ещё не присвоен
        publishedAt:
          type: string
          format: date
        city:
          type: string
        weather:
          type: string
          description: «Погода в погребе» в шапке газеты, строки через \n
        lead:
          $ref: "#/components/schemas/NewsStory"
        stories:
          type: array
          description: Материалы второй полосы по порядку (первый — широкий, второй — колонка)
          items:
            $ref: "#/components/schemas/NewsStory"
        briefs:
          type: array
          items:
            $ref: "#/components/schemas/NewsBrief"
        quote:
          type: object
          required: [text, author]
          properties:
            text:
              type: string
            author:
              type: string
        nextIssueTeaser:
          type: string
          description: Тема следующего номера
        ads:
          type: array
          items:
            $ref: "#/components/schemas/NewsAd"
        afisha:
          type: array
          items:
            $ref: "#/components/schemas/NewsAfishaItem"
        previousIssueId:
          type: [string, "null"]
        nextIssueId:
          type: [string, "null"]

    NewsClipping:
      type: object
      description: Короткая ссылка на статью — «Ещё вырезки»
      required: [slug, rubric, title]
      properties:
        slug:
          type: string
        rubric:
          $ref: "#/components/schemas/NewsRubric"
        title:
          type: string

    NewsArticle:
      type: object
      required:
        [slug, rubric, kicker, title, standfirst, byline, readingMinutes, issue, image, body, pullQuote, relatedWine, more]
      properties:
        slug:
          type: string
        rubric:
          $ref: "#/components/schemas/NewsRubric"
        kicker:
          type: string
        title:
          type: string
        standfirst:
          type: [string, "null"]
        byline:
          type: [string, "null"]
        readingMinutes:
          type: [integer, "null"]
        issue:
          type: object
          description: В каком выпуске вышла статья
          required: [id, number, publishedAt]
          properties:
            id:
              type: string
            number:
              type: [integer, "null"]
            publishedAt:
              type: string
              format: date
        image:
          oneOf:
            - $ref: "#/components/schemas/NewsImage"
            - type: "null"
        body:
          type: array
          description: Абзацы статьи
          items:
            type: string
        pullQuote:
          description: Вынесенная цитата — встаёт в текст после абзаца с номером afterParagraph (с 1)
          oneOf:
            - type: object
              required: [text, afterParagraph]
              properties:
                text:
                  type: string
                afterParagraph:
                  type: integer
                  minimum: 1
            - type: "null"
        relatedWine:
          description: Вино из статьи — для стикера «Забронировать»
          oneOf:
            - type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
            - type: "null"
        more:
          type: array
          description: Ещё вырезки — другие статьи
          items:
            $ref: "#/components/schemas/NewsClipping"

    NewsArchiveMonth:
      type: object
      required: [id, issuesCount]
      properties:
        id:
          type: string
          description: YYYY-MM
          examples: ["2026-10"]
        issuesCount:
          type: integer
          description: Сколько выпусков вышло за месяц (без учёта фильтра по рубрике)

    NewsArchiveIssue:
      type: object
      description: Первая полоса выпуска в подшивке
      required: [id, number, publishedAt, rubric, title, image, articleSlug]
      properties:
        id:
          type: string
        number:
          type: [integer, "null"]
        publishedAt:
          type: string
          format: date
        rubric:
          $ref: "#/components/schemas/NewsRubric"
        title:
          type: string
          description: Заголовок главного материала выпуска
        image:
          type: string
        articleSlug:
          type: string
          description: Статья, на которую ведёт карточка выпуска

    NewsArchive:
      type: object
      required: [months, month, issues]
      properties:
        months:
          type: array
          description: Месяцы подшивки, от свежего к старому
          items:
            $ref: "#/components/schemas/NewsArchiveMonth"
        month:
          type: string
          description: Какой месяц показан (YYYY-MM)
        issues:
          type: array
          items:
            $ref: "#/components/schemas/NewsArchiveIssue"

    ReviewTopic:
      type: string
      description: О чём письмо — штемпель «Тема» на конверте
      enum: [tasting, gift, reserve, hall, collection]

    Review:
      type: object
      required: [id, topic, greeting, text, postscript, author, city, signature, receivedAt]
      properties:
        id:
          type: string
        topic:
          $ref: "#/components/schemas/ReviewTopic"
        greeting:
          type: string
          examples: ["Дорогая команда бутика!"]
        text:
          type: string
        postscript:
          type: [string, "null"]
          description: Приписка «P.S.» целиком, с префиксом
        author:
          type: string
          description: Имя на конверте («От кого»)
        city:
          type: [string, "null"]
        signature:
          type: string
          description: Подпись под письмом
        receivedAt:
          type: [string, "null"]
          format: date
          description: Дата получения — на почтовом штемпеле

    ReviewPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
          description: Сколько всего опубликовано писем

    NewReview:
      type: object
      required: [name, text]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          maxLength: 80
        text:
          type: string
          minLength: 10
          maxLength: 3000

    NewsletterSubscription:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
