        time:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          description: Российский номер в формате +7XXXXXXXXXX
          pattern: "^\\+7\\d{10}$"
          examples: ["+79161234567"]
