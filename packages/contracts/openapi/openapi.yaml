openapi: 3.1.0
info:
  title: Wine Boutique API
  version: 0.1.0
  description: |
    Контракт API бутика — источник правды для фронтенда и ТЗ для бэкенда.
    Типы фронтенда генерируются из этого файла: `pnpm api:types` → src/shared/api/schema.ts.
    Пока сервера нет, ответы отдаёт MSW (обработчики в entities/*/api/mocks.ts и features/*/api/mocks.ts).
    Сессия — httpOnly-cookie, которую ставит сервер; клиент шлёт запросы с credentials: include.
servers:
  - url: /api
tags:
  - name: catalog
    description: Каталог вин
  - name: grapes
    description: Сорта винограда с собственных плантаций
  - name: auth
    description: Сессия посетителя
  - name: newsletter
    description: Подписка на закрытый канал анонсов
  - name: news
    description: Газета бутика «Винный Вѣстникъ»
  - name: reviews
    description: Письма гостей
  - name: reservations
    description: Бутики, бронь бутылок и самовывоз
  - name: tastings
    description: Дегустации в погребе — афиша, запись и лист ожидания
  - name: cellar
    description: Личные ячейки хранения в погребе
  - name: requests
    description: Заявки на услуги — зал, корпоративные подарки, набор месяца, сертификаты
  - name: account
    description: Личный кабинет — только для вошедших (шлюз проверяет сессию, без неё — 401)
  - name: loyalty
    description: Бонусы, уровни клуба и избранное

paths:
  /shelves:
    get:
      tags: [catalog]
      operationId: getShelves
      summary: Полки магазина с первыми бутылками
      description: Фильтры — те же, что у /wines; полка показывает подходящие под них вина и их число
      parameters:
        - $ref: "#/components/parameters/WineQuery"
        - $ref: "#/components/parameters/WineCountry"
        - $ref: "#/components/parameters/WineGrape"
        - $ref: "#/components/parameters/WinePriceMin"
        - $ref: "#/components/parameters/WinePriceMax"
        - $ref: "#/components/parameters/WineAge"
        - $ref: "#/components/parameters/WineVolume"
        - name: limit
          in: query
          description: Сколько бутылок показать на каждой полке
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 10
      responses:
        "200":
          description: Полки по порядку
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shelf"
        "400":
          $ref: "#/components/responses/BadRequest"

  /wines:
    get:
      tags: [catalog]
      operationId: getWines
      summary: Список вин
      parameters:
        - name: category
          in: query
          description: Тип вина (каталог погреба на главной); без параметра — все вина
          schema:
            $ref: "#/components/schemas/WineCategory"
        - $ref: "#/components/parameters/WineShelfParam"
        - $ref: "#/components/parameters/WineQuery"
        - $ref: "#/components/parameters/WineCountry"
        - $ref: "#/components/parameters/WineGrape"
        - $ref: "#/components/parameters/WinePriceMin"
        - $ref: "#/components/parameters/WinePriceMax"
        - $ref: "#/components/parameters/WineAge"
        - $ref: "#/components/parameters/WineVolume"
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/WineSort"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WinePage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /wines/facets:
    get:
      tags: [catalog]
      operationId: getWineFacets
      summary: Варианты фильтров и число вин в каждом
      description: |
        Счётчик варианта — сколько вин будет, если его выбрать: учитываются все фильтры, кроме фильтра этой же группы
        (выбранная страна не обнуляет счётчики других стран).
      parameters:
        - $ref: "#/components/parameters/WineShelfParam"
        - $ref: "#/components/parameters/WineQuery"
        - $ref: "#/components/parameters/WineCountry"
        - $ref: "#/components/parameters/WineGrape"
        - $ref: "#/components/parameters/WinePriceMin"
        - $ref: "#/components/parameters/WinePriceMax"
        - $ref: "#/components/parameters/WineAge"
        - $ref: "#/components/parameters/WineVolume"
      responses:
        "200":
          description: Группы фильтров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineFacets"
        "400":
          $ref: "#/components/responses/BadRequest"

  /wines/{slug}:
    get:
      tags: [catalog]
      operationId: getWine
      summary: Карточка вина
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            examples: [sassicaia-2015]
      responses:
        "200":
          description: Вино с паспортом, профилем вкуса и подачей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineDetails"
        "404":
          description: Такого вина нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /search/suggest:
    get:
      tags: [catalog]
      operationId: getSearchSuggestions
      summary: Подсказки поиска — вина, сорта и регионы
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestions"
        "400":
          $ref: "#/components/responses/BadRequest"

  /grapes:
    get:
      tags: [grapes]
      operationId: getGrapes
      summary: Сорта с плантаций и вина из них
      responses:
        "200":
          description: Список сортов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrapeVariety"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Кто сейчас вошёл
      responses:
        "200":
          description: Текущая сессия; user = null для гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /auth/phone/code:
    post:
      tags: [auth]
      operationId: requestPhoneCode
      summary: Прислать SMS с кодом входа
      description: |
        Код из 4 цифр живёт 5 минут, новый — не чаще раза в минуту и не больше 5 в час на номер.
        Ответ одинаковый для новых и известных номеров — по нему нельзя узнать, есть ли у номера карта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneCodeRequest"
      responses:
        "202":
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneCodeSent"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Неверный номер (code invalid_phone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Рано просить новый код или слишком много кодов (code too_many_requests, details — { retryAfter } в секундах)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/phone/verify:
    post:
      tags: [auth]
      operationId: verifyPhoneCode
      summary: Проверить код из SMS
      description: |
        Номер с картой — вход: ставим cookie сессии. Новый номер — токен регистрации на 15 минут.
        На код — 5 попыток, после них код сгорает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneCodeCheck"
      responses:
        "200":
          description: Код подошёл
          headers:
            Set-Cookie:
              description: __Host-session — при входе (status signed_in)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneVerification"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "410":
          description: Кода нет, он истёк или попытки кончились (code code_expired) — нужен новый
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Код не подошёл (code invalid_code, details — { attemptsLeft })
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [auth]
      operationId: registerGuest
      summary: Завести карту гостя после подтверждения номера
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRegistration"
      responses:
        "201":
          description: Карта заведена, гость вошёл
          headers:
            Set-Cookie:
              description: __Host-session
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "410":
          description: Токен регистрации истёк — подтвердите номер заново (code registration_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: underage — младше 18 лет, invalid_registration — неверные поля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: Выйти — сессия отзывается, cookie стирается
      responses:
        "204":
          description: Готово (и для гостя тоже)
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /news/issues/latest:
    get:
      tags: [news]
      operationId: getLatestNewsIssue
      summary: Свежий выпуск газеты целиком
      responses:
        "200":
          description: Выпуск со всеми материалами первой и второй полосы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsIssue"

  /news/articles/{slug}:
    get:
      tags: [news]
      operationId: getNewsArticle
      summary: Статья целиком
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Статья с выходными данными выпуска и связанными вырезками
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Статьи нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /news/archive:
    get:
      tags: [news]
      operationId: getNewsArchive
      summary: Подшивка — выпуски за месяц
      parameters:
        - name: month
          in: query
          description: Месяц в формате YYYY-MM; без параметра — последний месяц с выпусками
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
            examples: ["2026-09"]
        - name: rubric
          in: query
          description: Только выпуски, где главный материал этой рубрики
          schema:
            $ref: "#/components/schemas/NewsRubric"
      responses:
        "200":
          description: Список месяцев подшивки и выпуски выбранного месяца
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArchive"

  /newsletter:
    post:
      tags: [newsletter]
      operationId: subscribeNewsletter
      summary: Подписаться на анонсы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscription"
      responses:
        "204":
          description: Подписка оформлена (повторная подписка тоже 204)
        "422":
          description: Некорректный email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /boutiques:
    get:
      tags: [reservations]
      operationId: getBoutiques
      summary: Бутики, где можно забрать бронь
      responses:
        "200":
          description: Бутики по порядку
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Boutique"

  /boutiques/{id}/slots:
    get:
      tags: [reservations]
      operationId: getBoutiqueSlots
      summary: Когда можно забрать бронь — ближайшие семь дней
      description: |
        Время — по часам бутика, слоты по часу: последний — за час до закрытия, сегодняшние — не раньше чем через час.
        День, когда бутик закрыт или время уже вышло, приходит с пустым списком.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Семь дней начиная с сегодняшнего
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupDay"
        "404":
          description: Такого бутика нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations:
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Забронировать бутылки — отложим на имя гостя до самовывоза
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReservation"
      responses:
        "201":
          description: Бронь принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: |
            Бронь не принята: invalid_reservation — неверные контакты или нет согласий, slot_unavailable — время уже занято
            или бутик закрыт, unknown_wines — каких-то вин больше нет на полках (details — их id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Каталог не ответил — бронь не создана, можно повторить (code catalog_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations/{id}:
    get:
      tags: [reservations]
      operationId: getReservation
      summary: Квитанция о брони
      description: id — длинный случайный идентификатор, ссылку знает только гость; телефон и почта в ответ не попадают
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Бронь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Такой брони нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tastings:
    get:
      tags: [tastings]
      operationId: getTastings
      summary: Дегустации месяца
      description: |
        Время — по часам погреба (Europe/Moscow). Месяц вне афиши приходит пустым списком.
        Места меняются с каждой записью — ответ не кэшируется.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
            examples: ["2026-10"]
      responses:
        "200":
          description: Дегустации по времени начала
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tasting"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tastings/{id}/bookings:
    post:
      tags: [tastings]
      operationId: createTastingBooking
      summary: Записаться на дегустацию
      parameters:
        - $ref: "#/components/parameters/TastingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTastingBooking"
      responses:
        "201":
          description: Гости записаны — приглашение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TastingBooking"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Такой дегустации нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Запись не принята: tasting_closed — дегустация уже началась, not_enough_seats — свободных мест меньше,
            чем гостей (details — { seatsLeft }); при 0 мест — лист ожидания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверные имя или телефон, нет согласия (code invalid_booking)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tastings/{id}/waitlist:
    post:
      tags: [tastings]
      operationId: joinTastingWaitlist
      summary: Встать в лист ожидания — позвоним, если место освободится
      description: Повтор с тем же телефоном обновляет запись в листе, а не добавляет вторую
      parameters:
        - $ref: "#/components/parameters/TastingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTastingBooking"
      responses:
        "204":
          description: Гость в листе ожидания
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Такой дегустации нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: tasting_closed — дегустация уже началась, seats_available — места есть, можно записаться
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверные имя или телефон, нет согласия (code invalid_booking)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /cellar/cells:
    get:
      tags: [cellar]
      operationId: getCellarCells
      summary: Стена ячеек погреба — какие свободны
      description: Четыре ряда по восемь — сверху малые, ниже средние, внизу большие. Занятость меняется с договорами — ответ не кэшируется
      responses:
        "200":
          description: Ячейки по рядам слева направо
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CellarCell"

  /cellar/requests:
    post:
      tags: [cellar]
      operationId: createCellarRequest
      summary: Заявка на ячейку — перезвоним и договоримся о бутылках
      description: Ячейка не бронируется до договора в бутике — заявка только предупреждает управляющего
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCellarRequest"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellarRequest"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "409":
          description: Ячейку уже заняли (code cell_busy) — выберите другую
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверные имя, телефон или ячейка (code invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /requests/hall:
    post:
      tags: [requests]
      operationId: createHallRequest
      summary: Заявка на аренду зала — перезвоним в течение часа
      description: Гостей — не больше вместимости рассадки, дата — с завтрашнего дня и не дальше года
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHallRequest"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Заявка не принята — неверные поля (code invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /requests/gift:
    post:
      tags: [requests]
      operationId: createGiftRequest
      summary: Запрос сметы на корпоративные подарки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGiftRequest"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Заявка не принята — неверные поля (code invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /monthly:
    get:
      tags: [requests]
      operationId: getMonthlyCrates
      summary: Набор месяца — текущий ящик и прошлые
      responses:
        "200":
          description: Текущий ящик и архив от новых к старым
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyCrates"
        "404":
          description: Ящиков ещё нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /monthly/subscriptions:
    post:
      tags: [requests]
      operationId: createMonthlySubscription
      summary: Откладывать ящик каждый месяц
      description: Повтор с тем же телефоном обновляет набор и бутик, а не заводит вторую подписку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMonthlySubscription"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Заявка не принята — неверные поля (code invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /certificates:
    post:
      tags: [requests]
      operationId: createCertificate
      summary: Оформить подарочный сертификат
      description: Онлайн-оплаты пока нет — сертификат ждёт оплаты, ссылку пришлём SMS на телефон покупателя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCertificate"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Заявка не принята — неверные поля (code invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me:
    get:
      tags: [account]
      operationId: getProfile
      summary: Профиль гостя
      responses:
        "200":
          description: Профиль, настройки уведомлений и устройства
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [account]
      operationId: updateProfile
      summary: Изменить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          description: Неверные поля (code invalid_profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [account]
      operationId: deleteProfile
      summary: Удалить кабинет — карта, бонусы и сессии
      responses:
        "204":
          description: Удалено, cookie стёрта
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /me/sign-out-everywhere:
    post:
      tags: [account]
      operationId: signOutEverywhere
      summary: Выйти на всех устройствах
      responses:
        "204":
          description: Все сессии отозваны, cookie стёрта
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /me/reservations:
    get:
      tags: [account]
      operationId: getMyReservations
      summary: Мои брони — активные и история
      responses:
        "200":
          description: Брони гостя от новых к старым
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReservations"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/reservations/{id}/extend:
    post:
      tags: [account]
      operationId: extendMyReservation
      summary: Продлить бронь на 3 дня — один раз
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Бронь с новым сроком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Бронь не активна или уже продлена (code cannot_extend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/reservations/{id}/cancel:
    post:
      tags: [account]
      operationId: cancelMyReservation
      summary: Отменить бронь — бутылки вернутся на полку
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Отменённая бронь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Бронь уже не активна (code cannot_cancel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/tastings:
    get:
      tags: [account]
      operationId: getMyTastings
      summary: Мои дегустации — записи и лист ожидания
      responses:
        "200":
          description: От ближайших к прошедшим
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTastings"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/cell:
    get:
      tags: [account]
      operationId: getMyCell
      summary: Моя ячейка и опись
      responses:
        "200":
          description: Ячейка гостя; cell = null — ячейки нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCellResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/cell/prepare:
    post:
      tags: [account]
      operationId: prepareMyCell
      summary: Подготовить бутылки к визиту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCellPreparation"
      responses:
        "202":
          description: Сомелье поднимет бутылки из погреба
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellPreparation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Бутылок нет в описи или дата визита не подходит (code invalid_preparation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/monthly:
    get:
      tags: [account]
      operationId: getMyMonthly
      summary: Моя подписка на набор месяца
      responses:
        "200":
          description: Подписка; subscription = null — подписки нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMonthlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [account]
      operationId: updateMyMonthly
      summary: Пауза или пропуск месяца
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlySubscriptionUpdate"
      responses:
        "200":
          description: Подписка после изменения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMonthlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/certificates:
    get:
      tags: [account]
      operationId: getMyCertificates
      summary: Мои сертификаты
      responses:
        "200":
          description: Привязанные к кабинету сертификаты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCertificates"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [account]
      operationId: addMyCertificate
      summary: Добавить сертификат по номеру
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateClaim"
      responses:
        "201":
          description: Сертификат привязан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCertificate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Сертификат уже привязан к другому кабинету или не оплачен (code certificate_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/loyalty:
    get:
      tags: [loyalty]
      operationId: getMyLoyalty
      summary: Бонусы и уровень клуба
      responses:
        "200":
          description: Баланс, уровень, прогресс и история
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loyalty"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/favorites:
    get:
      tags: [loyalty]
      operationId: getMyFavorites
      summary: Избранные вина
      responses:
        "200":
          description: От недавно добавленных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyFavorites"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/favorites/{wineId}:
    put:
      tags: [loyalty]
      operationId: addFavorite
      summary: Добавить вино в избранное
      parameters:
        - name: wineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Добавлено (повтор — тоже 204)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Нет такого у этого гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [loyalty]
      operationId: removeFavorite
      summary: Убрать вино из избранного
      parameters:
        - name: wineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Убрано (нет в избранном — тоже 204)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /reviews:
    get:
      tags: [reviews]
      operationId: getReviews
      summary: Опубликованные письма гостей, от свежих к старым
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница писем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [reviews]
      operationId: sendReview
      summary: Отправить письмо — уходит сомелье на модерацию, публикуется с разрешения автора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReview"
      responses:
        "202":
          description: Письмо принято
        "422":
          description: Не заполнено имя или текст письма
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  parameters:
    TastingId:
      name: id
      in: path
      required: true
      description: Дата и время начала — «2026-10-17-1900»
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}-\\d{4}$"
    WineShelfParam:
      name: shelf
      in: query
      description: Полка магазина; без параметра — все вина
      schema:
        $ref: "#/components/schemas/WineShelf"
    WineQuery:
      name: q
      in: query
      description: Поиск по названию, сорту, региону, стране и винодельне
      schema:
        type: string
        minLength: 1
        maxLength: 100
    WineCountry:
      name: country
      in: query
      description: Страны (повтор параметра — несколько)
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
    WineGrape:
      name: grape
      in: query
      description: Сорта (повтор параметра — несколько)
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
    WinePriceMin:
      name: priceMin
      in: query
      description: Цена от, ₽; вина без цены под ценовой фильтр не попадают
      schema:
        type: integer
        minimum: 0
    WinePriceMax:
      name: priceMax
      in: query
      description: Цена до, ₽
      schema:
        type: integer
        minimum: 0
    WineAge:
      name: age
      in: query
      description: Выдержка — сколько лет вино в погребе
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/WineAge"
    WineVolume:
      name: volume
      in: query
      description: Объём бутылки, мл
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          examples: [750]

  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForeignOrigin:
      description: Изменяющий запрос пришёл из браузера с чужого сайта (code forbidden_origin) — защита от CSRF
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нужно войти (code unauthorized) — отвечает шлюз
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Слишком частые запросы с одного адреса (code too_many_requests)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_email]
        message:
          type: string
          description: Текст для пользователя, на русском
        details:
          description: Подробности для разработчика — ошибки полей при validation_failed, id вин при unknown_wines

    WineCategory:
      type: string
      enum: [red, white, sparkling, sweet]

    WineShelf:
      type: string
      description: red — красные, white — белые, sparkling — игристые и сладкие, aged — коллекция 10+ лет
      enum: [red, white, sparkling, aged]

    WineAge:
      type: string
      description: Выдержка по годам в погребе — up_to_3 (до 3 лет), from_3_to_10, from_10_to_20, over_20 (20+ лет)
      enum: [up_to_3, from_3_to_10, from_10_to_20, over_20]

    BottleShape:
      type: string
      description: Силуэт бутылки на полке — от него зависит картинка и высота
      enum: [red, white, sweet, sparkling, burgundy, flute, black, prosecco, port, tokaji]

    WineSort:
      type: string
      description: popular — популярные, price_asc / price_desc — по цене, vintage_asc — сначала старше урожай, new — новинки
      enum: [popular, price_asc, price_desc, vintage_asc, new]

    WineSummary:
      type: object
      description: Вино в списках (полки, каталог погреба, корзина)
      required: [id, slug, name, categories, region, country, grapes, volume, vintage, cellarYears, price, image, bottle]
      properties:
        id:
          type: string
        slug:
          type: string
          examples: [chateau-d-yquem-1988]
        name:
          type: string
          examples: [Château d’Yquem 1988]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/WineCategory"
        region:
          type: string
          examples: [Сотерн]
        country:
          type: [string, "null"]
          examples: [Франция]
        grapes:
          type: array
          items:
            type: string
          examples: [[семильон, совиньон блан]]
        volume:
          type: string
          examples: ["0,75 л"]
        vintage:
          type: [integer, "null"]
          description: Год урожая; null — вино без года
        cellarYears:
          type: [integer, "null"]
          description: Сколько лет бутылка в погребе бутика
        price:
          type: [integer, "null"]
          description: Цена за бутылку в рублях; null — цена ещё не назначена
        image:
          type: string
          description: URL изображения бутылки на прозрачном фоне
        bottle:
          $ref: "#/components/schemas/BottleShape"

    Shelf:
      type: object
      required: [id, title, note, description, total, wines]
      properties:
        id:
          $ref: "#/components/schemas/WineShelf"
        title:
          type: string
          examples: [Красные]
        note:
          type: string
          description: Подпись рядом с табличкой полки в магазине
          examples: [от Бордо до Мендосы]
        description:
          type: string
          description: Вступление на странице полки
        total:
          type: integer
          description: Сколько вин на полке подходит под фильтры
        wines:
          type: array
          items:
            $ref: "#/components/schemas/WineSummary"

    FacetOption:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer

    AgeFacetOption:
      type: object
      required: [value, count]
      properties:
        value:
          $ref: "#/components/schemas/WineAge"
        count:
          type: integer

    VolumeFacetOption:
      type: object
      required: [value, count]
      properties:
        value:
          type: integer
          description: Объём, мл
        count:
          type: integer

    PriceRange:
      type: object
      required: [min, max]
      properties:
        min:
          type: integer
        max:
          type: integer

    WineFacets:
      type: object
      required: [total, countries, grapes, ages, volumes, price]
      properties:
        total:
          type: integer
          description: Сколько вин подходит под все фильтры сразу
        countries:
          type: array
          items:
            $ref: "#/components/schemas/FacetOption"
        grapes:
          type: array
          items:
            $ref: "#/components/schemas/FacetOption"
        ages:
          type: array
          items:
            $ref: "#/components/schemas/AgeFacetOption"
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/VolumeFacetOption"
        price:
          description: Диапазон цен подходящих вин; null — ни у одного нет цены
          oneOf:
            - $ref: "#/components/schemas/PriceRange"
            - type: "null"

    TasteScale:
      type: object
      required: [level, word]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 5
        word:
          type: string
          examples: [полнотелое]

    TasteProfile:
      type: object
      required: [body, tannins, acidity, sweetness]
      properties:
        body:
          $ref: "#/components/schemas/TasteScale"
        tannins:
          $ref: "#/components/schemas/TasteScale"
        acidity:
          $ref: "#/components/schemas/TasteScale"
        sweetness:
          $ref: "#/components/schemas/TasteScale"

    TastingNotes:
      type: object
      required: [aroma, taste, finish]
      properties:
        aroma:
          type: string
        taste:
          type: string
        finish:
          type: string

    FoodPairing:
      type: object
      required: [icon, text]
      properties:
        icon:
          type: string
          description: Эмодзи
        text:
          type: string

    Serving:
      type: object
      required: [temperature, decanting, glass]
      properties:
        temperature:
          type: string
          examples: [16–18 °C]
        decanting:
          type: string
          examples: [1 час]
        glass:
          type: string
          examples: [Бордо]

    WineDetails:
      description: Карточка вина — всё из списка плюс паспорт, вкус, подача и соседи по полке
      allOf:
        - $ref: "#/components/schemas/WineSummary"
        - type: object
          required: [shelf, producer, appellation, abv, aging, potential, badges, profile, notes, food, serve, sommelierNote, related]
          properties:
            shelf:
